name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conflicts:
    name: Conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a merge left conflict markers
        run: |
          if grep -RInE '^<<<<<<<|^>>>>>>>' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=bin \
            --exclude-dir=obj \
            --exclude-dir=__pycache__ \
            .; then
            echo "Unresolved merge conflict markers found."
            exit 1
          fi

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaxora_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vaxora_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore Vaxora.Api/Vaxora.Api.csproj
      - name: Build
        run: dotnet build Vaxora.Api/Vaxora.Api.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore Vaxora.Api/Vaxora.Api.Tests/Vaxora.Api.Tests.csproj
      - name: Build tests
        run: dotnet build Vaxora.Api/Vaxora.Api.Tests/Vaxora.Api.Tests.csproj --configuration Release --no-restore
      - name: Run tests
        run: dotnet test Vaxora.Api/Vaxora.Api.Tests/Vaxora.Api.Tests.csproj --configuration Release --no-build --no-restore
        env:
          TEST_POSTGRESQL_CONNECTION: Host=localhost;Port=5432;Database=vaxora_test_db;Username=vaxora_test;Password=test_password

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Run tests
        working-directory: frontend
        run: npm test

  agent:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        run: pip install -r agent/requirements.txt
      - name: Check Python files compile
        run: python -m compileall -q agent
      - name: Run StaffSchedulingAgent evaluation suite
        working-directory: agent
        run: python -m pytest -q

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Run tests
        working-directory: mobile
        run: flutter test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [api, frontend, agent]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaxora_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vaxora_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install Agent Dependencies
        run: pip install -r agent/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Backend
        run: dotnet build Vaxora.Api/Vaxora.Api.csproj --configuration Release

      - name: Start Backend API
        run: dotnet run --project Vaxora.Api/Vaxora.Api.csproj --no-build --configuration Release > backend.log 2>&1 &
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=vaxora_test_db;Username=vaxora_test;Password=test_password;SSL Mode=Prefer;Trust Server Certificate=true
          ASPNETCORE_URLS: http://localhost:5004
          ASPNETCORE_ENVIRONMENT: Development

      - name: Start Agent Service
        run: python agent/main.py > agent.log 2>&1 &
        env:
          PORT: 8001
          VAXORA_API_BASE_URL: http://localhost:5004/api
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Start Frontend Server
        working-directory: frontend
        run: npm run dev > ../frontend.log 2>&1 &
        env:
          VITE_API_URL: http://localhost:5004

      - name: Wait for Services
        run: |
          for i in $(seq 1 45); do
            API_OK=$(curl -s http://localhost:5004/api/health | grep -c "healthy" || true)
            FRONTEND_OK=$(curl -s http://localhost:5173 > /dev/null && echo 1 || echo 0)
            AGENT_OK=$(curl -s http://localhost:8001/api/agent/health | grep -c "healthy" || true)
            LOGIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5004/api/auth/login -H "Content-Type: application/json" -d '{"email":"patient1@vaxora.lk","password":"Password123!"}' || echo "000")
            if [ "$API_OK" -ge 1 ] && [ "$FRONTEND_OK" -eq 1 ] && [ "$AGENT_OK" -ge 1 ] && [ "$LOGIN_CODE" -eq 200 ]; then
              echo "All services (API, Frontend, Agent) and seeded database accounts are online and verified!"
              exit 0
            fi
            echo "Waiting for services... ($i/45) [API: $API_OK, Frontend: $FRONTEND_OK, Agent: $AGENT_OK, PatientLoginCode: $LOGIN_CODE]"
            sleep 2
          done
          echo "=== Backend Log ==="
          cat backend.log || true
          echo "=== Agent Log ==="
          cat agent.log || true
          echo "=== Frontend Log ==="
          cat frontend.log || true
          echo "Services or seeded database accounts failed to start in time"
          exit 1

      - name: Run Playwright E2E Tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Service Logs
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: service-logs
          path: |
            backend.log
            agent.log
            frontend.log
          retention-days: 7

