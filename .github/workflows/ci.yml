name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conflicts:
    name: Conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a merge left conflict markers
        run: |
          if grep -RInE '^<<<<<<<|^>>>>>>>' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=bin \
            --exclude-dir=obj \
            --exclude-dir=__pycache__ \
            .; then
            echo "Unresolved merge conflict markers found."
            exit 1
          fi

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore Vaxora.Api/Vaxora.Api.csproj
      - name: Build
        run: dotnet build Vaxora.Api/Vaxora.Api.csproj --configuration Release --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  agent:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        run: pip install -r agent/requirements.txt
      - name: Check Python files compile
        run: python -m compileall -q agent
