name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conflicts:
    name: Conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a merge left conflict markers
        run: |
          if grep -RInE '^<<<<<<<|^>>>>>>>' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=bin \
            --exclude-dir=obj \
            --exclude-dir=__pycache__ \
            .; then
            echo "Unresolved merge conflict markers found."
            exit 1
          fi

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaxora_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vaxora_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore Vaxora.Api/Vaxora.Api.csproj
      - name: Build
        run: dotnet build Vaxora.Api/Vaxora.Api.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore Vaxora.Api/Vaxora.Api.Tests/Vaxora.Api.Tests.csproj
      - name: Build tests
        run: dotnet build Vaxora.Api/Vaxora.Api.Tests/Vaxora.Api.Tests.csproj --configuration Release --no-restore
      - name: Run tests
        run: dotnet test Vaxora.Api/Vaxora.Api.Tests/Vaxora.Api.Tests.csproj --configuration Release --no-build --no-restore
        env:
          TEST_POSTGRESQL_CONNECTION: Host=localhost;Port=5432;Database=vaxora_test_db;Username=vaxora_test;Password=test_password

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Run tests
        working-directory: frontend
        run: npm test

  agent:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        run: pip install -r agent/requirements.txt
      - name: Check Python files compile
        run: python -m compileall -q agent
      - name: Run StaffSchedulingAgent evaluation suite
        working-directory: agent
        run: python -m pytest -q
