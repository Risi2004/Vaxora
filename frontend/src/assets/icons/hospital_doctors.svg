  <!-- Windows -->
  <rect x="31" y="28" width="6" height="6" rx="1" fill="#38BDF8"/>
  <rect x="42" y="28" width="6" height="6" rx="1" fill="#38BDF8"/>
  <rect x="53" y="28" width="6" height="6" rx="1" fill="#38BDF8"/>
  <rect x="31" y="38" width="6" height="6" rx="1" fill="#38BDF8"/>
